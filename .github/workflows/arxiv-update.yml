name: Update arXiv Papers & Website

on:
  schedule:
    # Run at midnight EST (5 AM UTC) every day
    - cron: '0 * * * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Configure Git
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Copilot"
          git config --global user.email "noreply@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/nsaririan3/nsaririan3.github.io.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests xmltodict

      # Step 5: Create data directory if not exists
      - name: Create data directory
        run: mkdir -p data

      # Step 6: Fetch latest papers
      - name: Fetch latest papers
        run: |
          python scripts/fetch_papers.py

      # Step 7: Update papers.json
      - name: Update papers.json
        run: |
          python scripts/update_papers.py

      # Step 8: Copy papers.json to site root
      - name: Copy papers.json to root
        run: cp data/papers.json papers.json

      # Step 9: Commit and push changes
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data/papers.json data/papers-raw.json papers.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update paper list"
          git pull --rebase origin main
          git push origin HEAD:main

      # Step 10: Report Job Status
      - name: Pipeline Status Report
        if: always()
        run: |
          echo "=== Pipeline Execution Summary ==="
          echo "ArxivFetcher: ${{ steps.arxiv-fetch.outcome }}"
          echo "Papers Found: ${{ steps.check-fetch.outputs.papers_found || 0 }}"
          echo "ContentProcessor: ${{ steps.content-process.outcome }}"
          echo "HTMLGenerator: ${{ steps.html-generate.outcome }}"
          echo "Publisher: ${{ steps.publisher.outcome }}"
          echo "=================================="
          
          if [ "${{ steps.publisher.outcome }}" == "success" ]; then
            echo "✓ Pipeline completed successfully"
            echo "Website deployed to: https://nsaririan3.github.io/"
            echo "Papers fetched: ${{ steps.check-fetch.outputs.papers_found || 0 }}"
          else
            echo "✗ Pipeline had issues - check logs above"
            echo "Papers fetched: ${{ steps.check-fetch.outputs.papers_found || 0 }}"
          fi

      # Step 10: Notify on failure (optional)
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Pipeline failed - Check GitHub Actions logs for details"
          echo "Repository: https://github.com/nsaririan3/nsaririan3.github.io"
          echo "Actions: https://github.com/nsaririan3/nsaririan3.github.io/actions"
